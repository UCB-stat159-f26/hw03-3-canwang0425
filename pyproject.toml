[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oppo_age_gap"
version = "0.1.0"
description = "Retrieve tennis players' career matches from tennisabstract.com and plot age gaps vs. opponents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests", "pandas", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]